name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: python build.py

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist\SmoothScroll-Patcher.exe"
          $sum = "dist\SmoothScroll-Patcher.exe.sha256"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Test-Path $sum)) { throw "Missing $sum" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Content $sum

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothScroll-Patcher
          path: |
            dist/SmoothScroll-Patcher.exe
            dist/SmoothScroll-Patcher.exe.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmoothScroll-Patcher.exe
            dist/SmoothScroll-Patcher.exe.sha256
          generate_release_notes: true
